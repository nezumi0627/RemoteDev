name: Build Unsigned IPA

on:
  push:
    branches: [main]
    paths:
      - "remote-dev-app/**"
      - ".github/workflows/build-unsigned-ipa.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===========================================================
  # Step 1: バージョン変更時のみビルド（未変更なら macos ランナーを起動しない）
  # ===========================================================
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      build_number: ${{ steps.check.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version change
        id: check
        run: |
          set -e
          V_CONFIG="remote-dev-app/Version.xcconfig"

          CURRENT_VERSION=$(grep 'MARKETING_VERSION' "$V_CONFIG" | cut -d'=' -f2 | xargs)
          CURRENT_BUILD=$(grep 'CURRENT_PROJECT_VERSION' "$V_CONFIG" | cut -d'=' -f2 | xargs)
          echo "version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$CURRENT_BUILD" >> "$GITHUB_OUTPUT"

          # 手動実行は常にビルド
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 前回コミットとバージョンを比較
          if git show HEAD~1:"$V_CONFIG" >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD~1:"$V_CONFIG" | grep 'MARKETING_VERSION' | cut -d'=' -f2 | xargs)
            PREV_BUILD=$(git show HEAD~1:"$V_CONFIG" | grep 'CURRENT_PROJECT_VERSION' | cut -d'=' -f2 | xargs)
            if [ "$CURRENT_VERSION" != "$PREV_VERSION" ] || [ "$CURRENT_BUILD" != "$PREV_BUILD" ]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================
  # Step 2: 署名無し IPA ビルド
  # ===========================================================
  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Xcode info
        run: |
          xcodebuild -version
          swift --version || true

      # =========================================================
      # ビルド高速化: DerivedData キャッシュ（変更差分のみ再コンパイル）
      # =========================================================
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: remotedev-deriveddata-v3-${{ runner.os }}-${{ hashFiles('remote-dev-app/**') }}
          restore-keys: |
            remotedev-deriveddata-v3-${{ runner.os }}-

      # =========================================================
      # ビルド高速化: インデックス生成スキップ + デバッグ情報を最小化
      # =========================================================
      - name: Build unsigned app
        run: |
          set -euxo pipefail
          cd remote-dev-app
          xcodebuild \
            -project RemoteDev.xcodeproj \
            -scheme RemoteDev \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../DerivedData \
            -parallelizeTargets \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=YES \
            DEBUG_INFORMATION_FORMAT=dwarf \
            ENABLE_NS_ASSERTIONS=NO \
            GCC_OPTIMIZATION_LEVEL=s \
            build

      - name: Locate .app
        id: find_app
        run: |
          APP_PATH=$(find DerivedData -name "*.app" -type d | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app not found in DerivedData"
            exit 1
          fi
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found app: $APP_PATH"

      - name: Create IPA
        run: |
          set -e
          APP_PATH="${{ steps.find_app.outputs.app_path }}"
          V="${{ needs.check-version.outputs.version }}"
          B="${{ needs.check-version.outputs.build_number }}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

          IPA="RemoteDev-v${V}-build${B}-${SHORT_SHA}.ipa"
          zip -qr "$IPA" Payload

          echo "IPA=$IPA" >> "$GITHUB_ENV"
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD_NUM=$B" >> "$GITHUB_ENV"
          echo "Created $IPA"

      - name: Verify IPA
        run: |
          COUNT=$(unzip -l "$IPA" | grep -c Payload)
          echo "Payload entries: $COUNT"
          test "$COUNT" -gt 0

      # =========================================================
      # メタデータ: docs/apps.json を更新して Push（LiveContainer/SideStore ソース用）
      # =========================================================
      - name: Update apps.json
        run: |
          set -e
          SIZE_BYTES=$(stat -f%z "$IPA")
          SHA256=$(shasum -a 256 "$IPA" | awk '{print $1}')
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}-build${BUILD_NUM}/${IPA}"

          python3 scripts/update_apps_json.py "$VERSION" "$BUILD_NUM" "$DIRECT_URL" "$SIZE_BYTES" "$SHA256"

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/apps.json
          git commit -m "docs: update source for v${VERSION} (Build ${BUILD_NUM})" || echo "No changes to commit"
          git push origin main || echo "No changes to push"

      - name: Prepare release notes
        run: |
          set -e
          SIZE=$(du -h "$IPA" | cut -f1)
          DIRECT_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}-build${BUILD_NUM}/${IPA}"
          ENCODED_URL=$(echo -n "$DIRECT_URL" | python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read()))")

          OWNER=$(echo "${{ github.repository }}" | cut -d/ -f1)
          REPO=$(echo "${{ github.repository }}" | cut -d/ -f2)
          PAGES_URL="https://${OWNER}.github.io/${REPO}/apps.json"
          LC_B64=$(echo -n "$PAGES_URL" | base64 | tr -d '\n')

          cat > release-body.md <<EOF
          ## RemoteDev v${VERSION} (Build ${BUILD_NUM})

          - **IPA**: \`${IPA}\` (${SIZE})
          - **Commit**: \`${GITHUB_SHA}\` / \`${GITHUB_REF_NAME}\`

          ### 📲 インストール

          **LiveContainer 用ソース** (Source Repository に追加):
          \`\`\`text
          livecontainer://source?url=${LC_B64}
          \`\`\`

          **SideStore / AltStore 用ソース:**
          \`\`\`text
          ${PAGES_URL}
          \`\`\`

          **SideStore で直接インストール:**
          \`\`\`text
          sidestore://install?url=${ENCODED_URL}
          \`\`\`

          **注意**: この IPA は署名無しです。LiveContainer / SideStore / AltStore などでインストールしてください。
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}-build${{ env.BUILD_NUM }}
          name: "RemoteDev v${{ env.VERSION }} (Build ${{ env.BUILD_NUM }})"
          body_path: release-body.md
          files: ${{ env.IPA }}

      - name: Job Summary
        run: |
          {
            echo "# ✅ Build Completed"
            echo ""
            echo "- **Version:** v${VERSION} (Build ${BUILD_NUM})"
            echo "- **IPA:** \`${IPA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================
  # Step 3: スキップ通知
  # ===========================================================
  skip-notice:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip Summary
        run: |
          {
            echo "# ⏭️ Build Skipped"
            echo ""
            echo "Version unchanged (v${{ needs.check-version.outputs.version }}, build ${{ needs.check-version.outputs.build_number }})."
            echo "Update \`remote-dev-app/Version.xcconfig\` to trigger a new build."
          } >> "$GITHUB_STEP_SUMMARY"
